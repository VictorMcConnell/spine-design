# Runs on every push and pull request: the checks of the core code, and a fresh build that
# must come out the same as the index.html and _headers in the repository.
name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test.mjs
      - run: node tools/build.mjs
      - name: The built page matches the sources
        run: git diff --exit-code -- index.html _headers
